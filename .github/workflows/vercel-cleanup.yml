name: Vercel Cleanup

# Loescht alte Vercel-Deployments und behaelt nur die neuesten N (Standard: 10).
# Laeuft bei jedem Push auf main, nach jedem erfolgreichen Vercel-Deployment
# (deployment_status), woechentlich und manuell. Das aktuelle
# Production-Deployment wird nie geloescht.

on:
  push:
    branches: [main]
  deployment_status:
  schedule:
    - cron: "17 3 * * 0" # sonntags 03:17 UTC
  workflow_dispatch:
    inputs:
      keep:
        description: "Anzahl der zu behaltenden Deployments"
        default: "10"
      dry_run:
        description: "Nur anzeigen, nichts loeschen"
        type: boolean
        default: false

concurrency:
  group: vercel-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # Bei deployment_status nur nach erfolgreichem Deployment laufen
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Alte Deployments loeschen
        run: node scripts/cleanup-deployments.js
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          KEEP: ${{ inputs.keep || '10' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
