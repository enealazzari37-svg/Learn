name: Vercel Cleanup

# Loescht woechentlich alte Vercel-Deployments und behaelt nur die neuesten N
# (Standard: 10). Das aktuelle Production-Deployment wird nie geloescht.

on:
  schedule:
    - cron: "17 3 * * 0" # sonntags 03:17 UTC
  workflow_dispatch:
    inputs:
      keep:
        description: "Anzahl der zu behaltenden Deployments"
        default: "10"
      dry_run:
        description: "Nur anzeigen, nichts loeschen"
        type: boolean
        default: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Alte Deployments loeschen
        run: node scripts/cleanup-deployments.js
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          KEEP: ${{ inputs.keep || '10' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
