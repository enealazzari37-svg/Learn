<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#fff;font-family:"Inter Display","Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#bg{position:absolute;inset:0;background:radial-gradient(1100px 700px at 50% 62%,#f4f1ff 0%,rgba(255,255,255,0) 70%),#fff}
#top{position:absolute;left:0;right:0;top:120px;text-align:center}
#badge{display:inline-flex;align-items:center;gap:10px;padding:10px 22px 10px 18px;border-radius:999px;background:#efeaff;color:#5b3df5;font:600 30px/1 "Inter",sans-serif}
#badge svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#hl{position:relative;height:200px;margin-top:26px}
.hl{position:absolute;left:0;right:0;font:800 88px/1.02 "Inter Display","Inter",sans-serif;letter-spacing:-.045em;color:#0a0a0a;will-change:transform,opacity}
.hl span{display:block;color:#a6a6ad}
#dev{position:absolute;left:0;top:0;width:882px;height:1242px;transform-origin:0 0;will-change:transform}
#frame{position:absolute;inset:0;border-radius:56px;background:#16161a;box-shadow:0 0 0 3px #3a3a40 inset,0 60px 120px -30px rgba(30,20,80,.35),0 30px 60px -20px rgba(0,0,0,.25)}
#screen{position:absolute;left:24px;top:24px;width:834px;height:1194px;border-radius:32px;overflow:hidden;background:#fff}
#screen iframe{width:834px;height:1194px;border:0;display:block}
#cam{position:absolute}
#foot{position:absolute;left:0;right:0;bottom:84px;display:flex;justify-content:center;align-items:center;gap:12px;color:#55555c;font:600 34px/1 "Inter",sans-serif;letter-spacing:-.01em}
#fadeT{position:absolute;left:0;right:0;top:0;height:470px;background:linear-gradient(#fff 82%,rgba(255,255,255,0));z-index:30;pointer-events:none}
#fadeB{position:absolute;left:0;right:0;bottom:0;height:250px;background:linear-gradient(rgba(255,255,255,0),#fff 55%);z-index:30;pointer-events:none}
#top{z-index:31}#foot{z-index:31}
#foot img{width:40px;height:40px}
#cur{position:absolute;left:0;top:0;width:52px;height:52px;pointer-events:none;z-index:50;will-change:transform;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25))}
#ring{position:absolute;left:0;top:0;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;border:5px solid rgba(91,61,245,.55);pointer-events:none;z-index:49;opacity:0}
#touch{position:absolute;left:0;top:0;width:86px;height:86px;margin:-43px 0 0 -43px;border-radius:50%;background:rgba(255,255,255,.55);border:3px solid rgba(20,20,30,.22);box-shadow:0 6px 18px rgba(0,0,0,.18),inset 0 0 0 1px rgba(255,255,255,.6);pointer-events:none;z-index:49;opacity:0;backdrop-filter:blur(2px)}
#ring{border-color:rgba(255,255,255,.9)!important;box-shadow:0 0 0 2px rgba(20,20,30,.15)}
#end{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;z-index:60}
#end img{width:170px;height:170px;margin-bottom:46px}
#end h1{font:800 110px/1 "Inter Display",sans-serif;letter-spacing:-.05em;color:#0a0a0a}
#end h1 b{background:linear-gradient(90deg,#6d4af6,#b14ee0 55%,#ff6a3d);-webkit-background-clip:text;background-clip:text;color:transparent}
#end p{margin-top:26px;font:600 46px/1.2 "Inter",sans-serif;color:#9a9aa2;letter-spacing:-.02em}
#end .cta{margin-top:90px;padding:28px 54px;border-radius:999px;background:#0a0a0a;color:#fff;font:700 42px/1 "Inter",sans-serif;letter-spacing:-.01em}
#chip{position:absolute;z-index:40;left:540px;transform:translateX(-50%);top:1580px;display:none}
</style></head>
<body>
<div id="bg"></div>
<div id="top"><div id="badge"></div><div id="hl"></div></div>
<div id="dev"><div id="frame"></div><div id="screen"><iframe id="app" src="index.html?embed=1#/app/today"></iframe></div></div>
<div id="fadeT"></div><div id="fadeB"></div><div id="foot"><img src="logo.svg" alt=""><span>studix.space</span></div>
<div id="ring"></div><div id="touch"></div>
<svg id="cur" viewBox="0 0 32 32"><path d="M7 3.5v21.2l5.3-5.1 3.6 8.1 3.7-1.6-3.6-8h7.4z" fill="#111" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
<div id="end"><img src="logo.svg" alt=""><h1 id="endT"></h1><p id="endS"></p><div class="cta" id="endC">Free at studix.space</div></div>
<script>
const $=s=>document.querySelector(s), app=$("#app");
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)), lerp=(a,b,t)=>a+(b-a)*t;
const ICONS={cards:'<rect x="4" y="8" width="14" height="11" rx="2.5"/><path d="M7 5h11.5a2 2 0 012 2v9"/>',cal:'<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/>',note:'<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',pen:'<path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/>'};
const REEL={
  W:834,H:1194,doc:()=>app.contentDocument,win:()=>app.contentWindow,
  base:{x:99,y:452,z:1},
  cam:[], hls:[], acts:[], tweens:[], taps:[], cur:{pts:[]}, clicks:[], end:null, fired:new Set(),
  setup(cfg){Object.assign(this,cfg);$("#badge").innerHTML=`<svg viewBox="0 0 24 24">${ICONS[cfg.icon]||""}</svg>${cfg.badge}`;
    $("#hl").innerHTML=this.hls.map((h,i)=>`<div class="hl" id="h${i}">${h.a}<span>${h.b}</span></div>`).join("");
    if(cfg.end){$("#endT").innerHTML=cfg.end.t;$("#endS").textContent=cfg.end.s;}
  },
  /* Position eines Elements in der App → Bühnen-Koordinaten */
  pt(sel,dx=.5,dy=.5){const e=typeof sel==="function"?sel(this):typeof sel==="string"?this.doc().querySelector(sel):sel;if(!e)return null;const r=e.getBoundingClientRect(),f=app.getBoundingClientRect(),k=f.width/this.W;return{x:f.left+(r.left+r.width*dx)*k,y:f.top+(r.top+r.height*dy)*k};},
  camAt(t){const c=this.cam;let a=c[0];for(const k of c)if(k.t<=t)a=k;const i=c.indexOf(a),b=c[i+1];const v=k=>{if(k.at){if(!k._v)k._v=k.at(this)||{};k={...k,...k._v};}return{x:k.x??this.base.x,y:k.y??this.base.y,z:k.z??this.base.z}};
    if(!b)return v(a);const p=ease(clamp((t-a.t)/(b.d??(b.t-a.t))));const A=v(a),B=v(b);
    // Zoom um einen Fokuspunkt (fx,fy in App-Pixeln) -> x/y berechnen
    return{x:lerp(A.x,B.x,p),y:lerp(A.y,B.y,p),z:lerp(A.z,B.z,p)};},
  /* Kamera auf einen App-Punkt (px,py) mit Zoom z, Ziel auf der Bühne (sx,sy) */
  focus(px,py,z,sx=540,sy=1070){return{x:sx-(24+px)*z,y:sy-(24+py)*z,z};},
  /* Kamera auf ein App-Element (Mitte) mit Zoom z */
  fsel(sel,z,sy=1070,dy=.5){return R=>{const e=typeof sel==="function"?sel(R):R.q(sel);if(!e)return null;const r=e.getBoundingClientRect();return R.focus(r.left+r.width/2,r.top+r.height*dy,z,540,sy);};},
  tick(t){
    const c=this.camAt(t);$("#dev").style.transform=`translate(${c.x}px,${c.y}px) scale(${c.z})`;
    // Headlines
    this.hls.forEach((h,i)=>{const e=$("#h"+i),nx=this.hls[i+1],tin=clamp((t-h.t-(i?.28:0))/.5),tout=nx?clamp((t-nx.t)/.28):0;
      const op=ease(tin)*(1-ease(tout)),y=(1-ease(tin))*40-ease(tout)*30;e.style.opacity=op;e.style.transform=`translateY(${y}px)`;});
    // Tweens (z. B. Scrollen in der App)
    for(const w of (this.tweens||[]))if(t>=w.t0&&t<=w.t1+.1)w.f(this,ease(clamp((t-w.t0)/(w.t1-w.t0))));
    // Aktionen
    for(const [i,a] of this.acts.entries()){if(t>=a.t&&!this.fired.has(i)){this.fired.add(i);try{a.f(this)}catch(e){console.log("act",i,e.message)}}}
    // Cursor
    this.curTick(t);
    if(this.end){const o=ease(clamp((t-this.end.at)/.6));$("#end").style.opacity=o;$("#end").style.transform=`scale(${1.04-o*.04})`;}
  },
  /* Finger-Tipps wie bei iPad-Bildschirmaufnahmen: Kreis erscheint kurz vor dem Tipp, drückt, Welle, verschwindet */
  tapTick(t){const el=$("#touch"),ring=$("#ring");let o=0,x=0,y=0,s=1,ro=0,rs=.5;
    for(const tp of this.taps){const d=t-tp.t;if(d<-.35||d>.55)continue;if(d<.02||!tp._p){const q=this.pt(tp.sel,tp.dx??.5,tp.dy??.5);if(q)tp._p=q;}if(!tp._p)continue;
      x=tp._p.x;y=tp._p.y;o=d<0?clamp((d+.35)/.2):1-clamp((d-.18)/.3);s=d<0?1.12-.12*clamp((d+.35)/.35):d<.15?.86+.14*(d/.15):1;if(d>=0&&d<.5){ro=1-d/.5;rs=.5+d/.5*.9;}}
    el.style.opacity=o;el.style.transform=`translate(${x}px,${y}px) scale(${s})`;ring.style.opacity=ro;ring.style.transform=`translate(${x}px,${y}px) scale(${rs})`;$("#cur").style.opacity=0;},
  curTick(t){if(this.taps.length)return this.tapTick(t);const P=this.cur.pts;const el=$("#cur"),ring=$("#ring");if(!P.length){el.style.opacity=0;return;}
    let a=null,b=null;for(const p of P){if(p.t<=t)a=p;else{b=b||p;}}
    const pos=p=>{const q=p.sel?this.pt(p.sel,p.dx??.5,p.dy??.5):p;return q?{x:q.x+(p.ox||0),y:q.y+(p.oy||0)}:{x:540,y:2100}};
    let x,y;if(!a){const q=pos(P[0]);x=q.x+160;y=q.y+420;}else if(!b||t>=b.t-(b.d||.7)){if(b&&t<b.t){const p=ease(clamp((t-(b.t-(b.d||.7)))/(b.d||.7)));const A=pos(a),B=pos(b);x=lerp(A.x,B.x,p);y=lerp(A.y,B.y,p);}else{const q=pos(a);x=q.x;y=q.y;}}else{const q=pos(a);x=q.x;y=q.y;}
    const vis=clamp((t-(P[0].t-1))/.4)*(this.cur.hide?1-clamp((t-this.cur.hide)/.3):1);
    let s=1;for(const ct of this.clicks){const d=t-ct;if(d>=0&&d<.25)s=1-.18*Math.sin(d/.25*Math.PI);}
    el.style.opacity=vis;el.style.transform=`translate(${x-12}px,${y-6}px) scale(${s})`;
    let ro=0,rs=.4;for(const ct of this.clicks){const d=t-ct;if(d>=0&&d<.5){ro=1-d/.5;rs=.4+d/.5*.9;}}
    ring.style.opacity=ro*vis;ring.style.transform=`translate(${x}px,${y}px) scale(${rs})`;
  },
  /* Hilfen für Aktionen */
  q(s){return this.doc().querySelector(s)},
  qt(sel,txt){return [...this.doc().querySelectorAll(sel)].find(e=>e.textContent.trim().startsWith(txt))},
  click(s){const e=typeof s==="string"?this.q(s):s;e&&e.click();},
  go(r){this.win().location.hash="#/app/"+r;},
  /* Text Zeichen für Zeichen in ein Feld tippen (als Aktionen ab Zeit t) */
  typeActs(t,sel,txt,cps=14){return [...txt].map((ch,i)=>({t:t+i/cps,f:R=>{const e=typeof sel==="function"?sel(R):R.q(sel);if(!e)return;e.focus();if(e.isContentEditable)R.doc().execCommand("insertText",false,ch);else{e.value+=ch;e.dispatchEvent(new Event("input",{bubbles:true}));}}}));},
  css(c){const s=this.doc().createElement("style");s.textContent=c;this.doc().head.appendChild(s);}
};
window.REEL=REEL;
</script>
</body></html>
